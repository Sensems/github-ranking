name: Backfill History (disabled)

# Disabled 2026-08: GitHub restricted GET /repos/{owner}/{repo}/stargazers to repo
# admins/collaborators only (https://github.blog/changelog/2026-06-30-upcoming-access-restrictions-to-public-api-endpoints-and-ui-views/).
# G3 backfill cannot fetch third-party star timelines (403). Yearly board fills from daily sync snapshots (~365 days).
# See docs/OPERATIONS.md

on:
  workflow_dispatch: {}

concurrency:
  group: history-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  disabled-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill is disabled
        run: |
          echo "::warning::Backfill History 已停用：GitHub Stargazers API 仅仓库协作者可访问，无法为第三方仓库补 365 天锚点。"
          echo "年榜改由 Daily Sync 每日快照自然积累（约 365 天）。"
          echo "详见 docs/OPERATIONS.md"
