name: Backfill History
on:
  schedule:
    - cron: "30 0 * * *"   # 每日小批量（UTC 00:30 = 北京时间 08:30）
  workflow_dispatch: {}

concurrency:
  group: history-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Migrate schema
        run: python scripts/main.py migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run backfill
        run: python scripts/main.py backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
