name: Daily Sync
on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}

concurrency:
  group: daily-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Migrate schema
        run: python scripts/main.py migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run sync
        run: python scripts/main.py sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_BASE_URL: ${{ secrets.XFYUN_BASE_URL }}
          XFYUN_MODEL: ${{ secrets.XFYUN_MODEL || 'xsparkx2' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --prefix frontend
      - name: Build Nuxt SSR
        run: npm run build --prefix frontend

      - name: Deploy to server
        if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_PATH != '' && secrets.SSH_PRIVATE_KEY != '' }}
        run: bash deploy/deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_RESTART_CMD: ${{ secrets.DEPLOY_RESTART_CMD }}

      - name: Skip deploy (secrets not configured)
        if: ${{ secrets.DEPLOY_HOST == '' || secrets.DEPLOY_USER == '' || secrets.DEPLOY_PATH == '' || secrets.SSH_PRIVATE_KEY == '' }}
        run: echo "Deploy skipped — set DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, SSH_PRIVATE_KEY to enable SSH deploy."

      - name: Notify on failure
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "${{ secrets.NOTIFY_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"GitHub Star 趋势榜每日同步失败: $RUN_URL\"}"
